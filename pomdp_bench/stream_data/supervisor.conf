[unix_http_server]
file=/run/supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
logfile=/var/log/commerce/supervisord.log
pidfile=/run/supervisord.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/supervisor.sock
[program:alpha]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/alpha -p 5432
user=postgres
priority=10
autorestart=true
stdout_logfile=/var/log/commerce/alpha.log
redirect_stderr=true
[program:beta]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/beta -p 5433
user=postgres
priority=10
autorestart=true
stdout_logfile=/var/log/commerce/beta.log
redirect_stderr=true
[program:broker]
command=/opt/kafka/bin/kafka-server-start.sh /etc/commerce/broker.properties
environment=KAFKA_HEAP_OPTS="-Xms256m -Xmx512m",KAFKA_LOG4J_OPTS="-Dlog4j2.configurationFile=/etc/commerce/log4j2.properties"
priority=20
autorestart=true
stopwaitsecs=20
stdout_logfile=/var/log/commerce/broker.log
redirect_stderr=true
[program:connect]
command=/opt/kafka/bin/connect-distributed.sh /etc/commerce/connect.properties
environment=KAFKA_HEAP_OPTS="-Xms256m -Xmx768m",KAFKA_LOG4J_OPTS="-Dlog4j2.configurationFile=/etc/commerce/log4j2.properties"
priority=30
autorestart=true
stopwaitsecs=20
stdout_logfile=/var/log/commerce/connect.log
redirect_stderr=true
[program:api]
command=/usr/bin/python3 -u /srv/commerce/service.py api
priority=40
autorestart=true
stdout_logfile=/var/log/commerce/api.log
redirect_stderr=true
[program:dispatch]
command=/usr/bin/python3 -u /srv/commerce/service.py dispatch
priority=50
autorestart=true
startsecs=0
stopwaitsecs=15
stdout_logfile=/var/log/commerce/dispatch.log
redirect_stderr=true
