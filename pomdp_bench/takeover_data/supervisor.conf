[unix_http_server]
file=/run/supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/supervisor.sock
[program:alpha]
command=/usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/alpha -p 5432
user=postgres
autostart=true
autorestart=unexpected
stopsignal=INT
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/orders/alpha.log
[program:beta]
command=/usr/lib/postgresql/18/bin/postgres -D /var/lib/postgresql/beta -p 5433
user=postgres
autostart=true
autorestart=unexpected
stopsignal=INT
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/orders/beta.log
[program:orders]
command=/usr/bin/python3 -u /srv/orders/orders.py
directory=/srv/orders
autostart=true
autorestart=unexpected
redirect_stderr=true
stdout_logfile=/var/log/orders/api.log
