name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall pomdp_bench harness tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify released dataset
        run: python tools/verify_release.py
      - name: Verify frozen study
        run: python tools/verify_study.py
      - name: Generate and evaluate offline controls
        run: python -m pomdp_bench demo --out artifacts/ci-demo --count 3
      - name: Replay and verify the entire matrix
        run: python -m pomdp_bench validate artifacts/ci-demo
      - name: Verify documentation links
        run: python tools/check_docs.py
      - name: Verify published discovery and recovery controls
        run: python -m pomdp_bench.discovery_controls --validate studies/discovery-recovery-v1/controls.json
      - name: Reproduce discovery and recovery controls
        run: python -m pomdp_bench.discovery_controls --out artifacts/discovery-controls.json
      - name: Replay reproduced discovery and recovery controls
        run: python -m pomdp_bench.discovery_controls --validate artifacts/discovery-controls.json
      - name: Recompute analysis
        run: python harness/analyze_results.py > analysis-output.json
      - name: Generate structural difficulty controls
        run: python -m pomdp_bench generate-cover --count 2 --scales sanity challenge hard extreme --out artifacts/cover-suite.json
      - name: Collect structural difficulty controls
        run: python -m pomdp_bench run --suite artifacts/cover-suite.json --agents examples/coverage-agents.json --out artifacts/cover
      - name: Replay structural difficulty controls
        run: python -m pomdp_bench validate artifacts/cover
      - name: Reproduce experimental depth and solver controls
        run: python studies/coverage-depth-v1/controls.py artifacts/depth-controls
      - name: Replay experimental solver controls
        run: python -m pomdp_bench validate artifacts/depth-controls/solver_assisted
      - name: Verify recomputed outputs
        run: python tools/verify_release.py
