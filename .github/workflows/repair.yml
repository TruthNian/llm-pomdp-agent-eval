name: Repository repair

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-code-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Resolve immutable execution image
        shell: bash
        run: |
          docker pull python:3.13-slim
          image=$(docker image inspect python:3.13-slim --format '{{.Id}}')
          echo "REPAIR_IMAGE=$image" >> "$GITHUB_ENV"
          mkdir -p artifacts
          docker image inspect "$image" --format '{{json .RepoDigests}}' > artifacts/repair-image-digests.json
      - name: Execute real upstream defect and all controls
        run: python studies/repository-repair-v1/controls.py --image "$REPAIR_IMAGE" --out artifacts/repair-controls
      - name: Replay recorded behavior without executing source
        run: python -m pomdp_bench validate artifacts/repair-controls
      - name: Retain successes, failures and partial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-repair-evidence
          path: |
            artifacts/repair-controls
            artifacts/repair-image-digests.json
          if-no-files-found: error
